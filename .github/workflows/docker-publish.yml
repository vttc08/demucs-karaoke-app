name: Build and publish Docker images

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - adapters/**
      - demucs_svc/**
      - locales/**
      - routes/**
      - services/**
      - static/**
      - templates/**
      - config.py
      - database.py
      - logging_config.py
      - main.py
      - models.py
      - .github/workflows/docker-publish.yml
  push:
    branches:
      - dev
      - main
    tags:
      - "v*.*.*"
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - adapters/**
      - demucs_svc/**
      - locales/**
      - routes/**
      - services/**
      - static/**
      - templates/**
      - config.py
      - database.py
      - logging_config.py
      - main.py
      - models.py
      - .github/workflows/docker-publish.yml

env:
  IMAGE_NAME: vttc08/demucs-karaoke-app
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test-images:
    name: Build and smoke-test ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image: karaoke:ci-app
            check: >-
              python -c "import fastapi, yt_dlp" &&
              test -x /usr/local/bin/deno &&
              ffmpeg -version >/dev/null &&
              ffprobe -version >/dev/null
          - target: vocal-sync
            image: karaoke:ci-vocal-sync
            check: >-
              python -c "import fastapi, numpy, scipy, yt_dlp" &&
              test -x /usr/local/bin/deno &&
              ffmpeg -version >/dev/null &&
              ffprobe -version >/dev/null

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.target }}-test
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-test

      - name: Smoke-test ${{ matrix.target }} image
        run: >-
          docker run --rm --entrypoint /bin/sh ${{ matrix.image }}
          -c '${{ matrix.check }}'

  publish:
    name: Publish multi-platform images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive release tags
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Publish vocal-sync first so the normal image's latest tag is the most
      # recently pushed entry when Docker Hub is sorted by newest.
      - name: Publish vocal-sync app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: vocal-sync
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-vocal-sync
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}-vocal-sync
          cache-from: type=gha,scope=vocal-sync-release
          cache-to: type=gha,mode=max,scope=vocal-sync-release
          provenance: mode=max
          sbom: true

      - name: Publish lightweight app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=app-release
          cache-to: type=gha,mode=max,scope=app-release
          provenance: mode=max
          sbom: true
