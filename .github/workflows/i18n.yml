name: Validate internationalization

on:
  pull_request:
    paths:
      - locales/**
      - docs-site/mkdocs.yml
      - scripts/audit_i18n.py
      - tests/test_docs_i18n.py
      - .github/workflows/i18n.yml
  push:
    branches:
      - dev
      - main
    paths:
      - locales/**
      - docs-site/mkdocs.yml
      - scripts/audit_i18n.py
      - tests/test_docs_i18n.py
      - .github/workflows/i18n.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate locale catalogs and docs languages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Validate locale catalogs
        run: uv run python scripts/audit_i18n.py --check

      - name: Validate documentation language coverage
        run: uv run --extra dev pytest tests/test_docs_i18n.py
