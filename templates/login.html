<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NEON PULSE - Enter the Stage</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#00f2ff",
                        "secondary": "#ff68a7",
                        "tertiary": "#b586ff",
                        "background": "#0e0c1f",
                        "surface": "#0e0c1f",
                        "surface-container": "#19172e",
                        "surface-container-low": "#131126",
                        "surface-container-lowest": "#000000",
                        "surface-container-high": "#1f1c36",
                        "surface-container-highest": "#25223e",
                        "on-surface": "#e7e2fe",
                        "on-surface-variant": "#aca8c2",
                        "outline": "#76738b",
                        "outline-variant": "#48455b",
                        "primary-container": "#00ffff",
                        "on-primary-container": "#005d5d",
                        "tertiary-container": "#8f43fb",
                        "on-tertiary-container": "#ffffff",
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Epilogue"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(37, 34, 62, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 48px; /* xl: 3rem */
        }
        .tab-bar {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 32px; /* 48px - 16px (p-4) */
            padding: 4px; /* p-1 */
        }
        .tab-button {
            border-radius: 28px; /* 32px - 4px (p-1) */
            width: 100%;
            padding: 10px 16px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .form-input {
            background-color: rgba(14, 12, 31, 0.8) !important;
            background-image: none !important;
            border: 1px solid #33334d !important;
            border-radius: 0.5rem !important;
            width: 100%;
            padding: 1rem;
            color: #e7e2fe !important;
            transition: all 0.3s;
            outline: none;
            appearance: none !important;
            -webkit-appearance: none !important;
        }
        .form-input:focus {
            border-color: #00f2ff !important;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.25) !important;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col items-center justify-center p-4 md:p-6 relative overflow-x-hidden">
    <!-- Cinematic Background (Desktop) -->
    <div class="fixed inset-0 z-0 hidden md:block">
        <img class="w-full h-full object-cover opacity-20 brightness-50" alt="Cinematic karaoke lounge" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBG_OgSm5sQHtg2z5cnRAcTTzlxoJerM_GkeSrwmG3wcGSM7uXIYOWEIHnUq8ife4LIWtq2k1WxfZk5p7z0gDfBeA-UEVklki9QCWgn4SYtAMqzc5zMFpqD5Tm7qNeZFXeQ_r1ofkRy_OjaimT0Ns7k0gYkQvITEvexvfdRqjt6jMViawvRa0XsufKRwtvJFNgOCLwBtpUzLNMhOxK_-A67tFskzKsffbtlSFjAX4z6CAolxjwBzjqfZq3O9BXf-tLMO4dQ8k4lA4iB"/>
    </div>

    <!-- Brand Identity Section -->
    <div class="w-full max-w-sm mb-8 md:mb-12 text-center z-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container-highest rounded-xl mb-6 border border-white/5">
            <span class="material-symbols-outlined text-primary text-4xl">mic_external_on</span>
        </div>
        <h1 class="font-headline text-4xl md:text-6xl font-black text-white tracking-tighter leading-tight">
            Enter the <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-primary-container">Pulse</span>
        </h1>
        <p class="text-on-surface-variant mt-4 font-medium tracking-wide text-sm md:text-base">Ready for your main stage moment?</p>
    </div>

    <!-- Login Container -->
    <div class="w-full max-w-[min(100%,384px)] md:max-w-md glass-card p-4 z-10 shadow-2xl border border-white/5">
        <!-- Segmented Control (Tabs) -->
        <div class="grid grid-cols-2 tab-bar mb-6">
            <button id="guest-tab" class="tab-button {% if login_mode == 'admin' %}text-on-surface-variant hover:text-on-surface{% else %}bg-surface-container-highest text-primary{% endif %}">
                Guest
            </button>
            <button id="admin-tab" class="tab-button {% if login_mode == 'admin' %}bg-surface-container-highest text-primary{% else %}text-on-surface-variant hover:text-on-surface{% endif %}">
                Admin
            </button>
        </div>

        <div class="px-4 pb-8">
            {% if error %}
            <div class="mb-5 rounded-lg border border-red-400/40 bg-red-950/40 px-4 py-3 text-sm font-semibold text-red-100">
                {{ error }}
            </div>
            {% endif %}

            <!-- Guest View: Stage Name -->
            <form action="{{ app_url('/login') }}" method="POST" id="guest-form" class="{% if login_mode == 'admin' %}hidden {% endif %}space-y-6">
                <input type="hidden" name="type" value="guest">
                <div class="relative">
                    <label class="block text-[10px] uppercase font-bold tracking-[0.2em] text-primary/70 mb-2 ml-1">Your Stage Name</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">person</span>
                        <input name="username" class="form-input pl-12 placeholder:text-outline font-medium text-lg" placeholder="e.g. NeonRockstar" type="text" required/>
                    </div>
                </div>
                <button type="submit" class="w-full py-3 rounded-2xl bg-gradient-to-r from-primary to-primary-container text-on-primary-container font-headline font-black text-base uppercase tracking-widest active:scale-95 transition-transform hover:brightness-110">
                    Claim the Mic
                </button>
            </form>

            <!-- Admin View (Hidden by default) -->
            <form action="{{ app_url('/login') }}" method="POST" id="admin-form" class="{% if login_mode != 'admin' %}hidden {% endif %}space-y-6">
                <input type="hidden" name="type" value="admin">
                {% if admin_configured is sameas false %}
                <p class="text-sm font-semibold text-on-surface-variant">
                    No admin account is configured. Create one on the server before signing in.
                </p>
                {% endif %}
                <div class="space-y-4">
                    <div class="relative">
                        <label class="block text-[10px] uppercase font-bold tracking-[0.2em] text-primary/70 mb-2 ml-1">Username</label>
                        <input name="username" class="form-input placeholder:text-outline font-medium" type="text" required/>
                    </div>
                    <div class="relative">
                        <label class="block text-[10px] uppercase font-bold tracking-[0.2em] text-primary/70 mb-2 ml-1">Password</label>
                        <input name="password" class="form-input placeholder:text-outline font-medium" type="password" required/>
                    </div>
                </div>
                <button type="submit" class="w-full py-3 rounded-2xl bg-tertiary-container text-on-tertiary-container font-headline font-black text-base uppercase tracking-widest active:scale-95 transition-transform hover:brightness-110">
                    Access Control
                </button>
            </form>
        </div>
    </div>

    <!-- Footer Decorative Elements -->
    <div class="mt-12 z-10 flex flex-col items-center gap-6">
        <p class="text-on-surface-variant text-sm font-medium">Join the session and show your talent</p>
    </div>

    <!-- Asymmetric Decorative Element -->
    <div class="absolute bottom-10 right-10 opacity-20 transform rotate-12 pointer-events-none">
        <span class="material-symbols-outlined text-[120px] text-secondary" style="font-variation-settings: 'FILL' 1;">music_note</span>
    </div>

    <script>
        const guestTab = document.getElementById('guest-tab');
        const adminTab = document.getElementById('admin-tab');
        const guestForm = document.getElementById('guest-form');
        const adminForm = document.getElementById('admin-form');

        guestTab.addEventListener('click', () => {
            guestTab.classList.add('bg-surface-container-highest', 'text-primary');
            guestTab.classList.remove('text-on-surface-variant');
            adminTab.classList.remove('bg-surface-container-highest', 'text-primary');
            adminTab.classList.add('text-on-surface-variant');
            guestForm.classList.remove('hidden');
            adminForm.classList.add('hidden');
        });

        adminTab.addEventListener('click', () => {
            adminTab.classList.add('bg-surface-container-highest', 'text-primary');
            adminTab.classList.remove('text-on-surface-variant');
            guestTab.classList.remove('bg-surface-container-highest', 'text-primary');
            guestTab.classList.add('text-on-surface-variant');
            adminForm.classList.remove('hidden');
            guestForm.classList.add('hidden');
        });
    </script>
</body>
</html>
