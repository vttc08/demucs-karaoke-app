<!DOCTYPE html>
<html class="dark" lang="{{ current_locale(request) }}">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{{ t('login.title') }}</title>
    <link rel="stylesheet" href="{{ static_asset_url('/static/tailwind.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(37, 34, 62, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 48px; /* xl: 3rem */
        }
        .form-input {
            background-color: rgba(14, 12, 31, 0.8) !important;
            background-image: none !important;
            border: 1px solid #33334d !important;
            border-radius: 0.5rem !important;
            width: 100%;
            padding: 1rem;
            color: #e7e2fe !important;
            transition: all 0.3s;
            outline: none;
            appearance: none !important;
            -webkit-appearance: none !important;
        }
        .form-input:focus {
            border-color: #00f2ff !important;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.25) !important;
        }
    </style>
</head>
<body class="bg-background text-on-background font-login-body selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col items-center justify-center p-4 md:p-6 relative overflow-x-hidden">
    <!-- Cinematic Background (Desktop) -->
    <div class="fixed inset-0 z-0 hidden md:block">
        <img class="w-full h-full object-cover opacity-20 brightness-50" alt="Cinematic karaoke lounge" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBG_OgSm5sQHtg2z5cnRAcTTzlxoJerM_GkeSrwmG3wcGSM7uXIYOWEIHnUq8ife4LIWtq2k1WxfZk5p7z0gDfBeA-UEVklki9QCWgn4SYtAMqzc5zMFpqD5Tm7qNeZFXeQ_r1ofkRy_OjaimT0Ns7k0gYkQvITEvexvfdRqjt6jMViawvRa0XsufKRwtvJFNgOCLwBtpUzLNMhOxK_-A67tFskzKsffbtlSFjAX4z6CAolxjwBzjqfZq3O9BXf-tLMO4dQ8k4lA4iB"/>
    </div>

    <!-- Brand Identity Section -->
    <div class="w-full max-w-sm mb-8 md:mb-12 text-center z-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container-highest rounded-[3rem] mb-6 border border-white/5">
            <span class="material-symbols-outlined text-primary text-4xl">mic_external_on</span>
        </div>
        <h1 class="font-login-headline text-4xl md:text-6xl font-black text-white tracking-tighter leading-tight">
            {{ t('login.enter_pulse') }}
        </h1>
        <p class="text-on-surface-variant mt-4 font-medium tracking-wide text-sm md:text-base">{{ t('login.admin_access') }}</p>
    </div>

    <!-- Login Container -->
    <div class="w-full max-w-[min(100%,384px)] md:max-w-md glass-card p-4 z-10 shadow-2xl border border-white/5">
        <div class="px-4 pb-8">
            {% if error %}
            <div class="mb-5 rounded-[2rem] border border-red-400/40 bg-red-950/40 px-4 py-3 text-sm font-semibold text-red-100">
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ app_url('/login') }}" method="POST" id="admin-form" class="space-y-6">
                <input type="hidden" name="type" value="admin">
                {% if admin_configured is sameas false %}
                <p class="text-sm font-semibold text-on-surface-variant">
                    {{ t('login.no_admin') }}
                </p>
                {% endif %}
                <div class="space-y-4">
                    <div class="relative">
                        <label class="block text-[10px] uppercase font-bold tracking-[0.2em] text-primary/70 mb-2 ml-1">{{ t('login.username') }}</label>
                        <input name="username" class="form-input placeholder:text-outline font-medium" type="text" required/>
                    </div>
                    <div class="relative">
                        <label class="block text-[10px] uppercase font-bold tracking-[0.2em] text-primary/70 mb-2 ml-1">{{ t('login.password') }}</label>
                        <input name="password" class="form-input placeholder:text-outline font-medium" type="password" required/>
                    </div>
                </div>
                <button type="submit" class="w-full py-3 rounded-2xl bg-tertiary-container text-on-tertiary-container font-login-headline font-black text-base uppercase tracking-widest active:scale-95 transition-transform hover:brightness-110">
                    {{ t('login.access_control') }}
                </button>
            </form>
            <div class="mt-5 text-center">
                <a href="{{ app_url('/queue') }}" class="text-sm font-semibold text-on-surface-variant transition-colors hover:text-primary">
                    {{ t('login.continue_guest') }}
                </a>
            </div>
        </div>
    </div>

    <!-- Footer Decorative Elements -->
    <div class="mt-12 z-10 flex flex-col items-center gap-6">
        <p class="text-on-surface-variant text-sm font-medium">{{ t('login.admin_only') }}</p>
    </div>

    <!-- Asymmetric Decorative Element -->
    <div class="absolute bottom-10 right-10 opacity-20 transform rotate-12 pointer-events-none">
        <span class="material-symbols-outlined text-[120px] text-[#ff68a7]" style="font-variation-settings: 'FILL' 1;">music_note</span>
    </div>
</body>
</html>
