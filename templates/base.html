<!DOCTYPE html>
<html class="dark" lang="{{ current_locale(request) }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t('app.karaoke') }}{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ app_url('/static/favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ app_url('/static/karaoke-icon.png') }}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00f2ff",
                        "secondary": "#3ce36a", 
                        "tertiary": "#ffb950",
                        "background": "#0e0c1f",
                        "surface": "#0e0c1f",
                        "surface-container": "#19172e",
                        "surface-container-low": "#131126",
                        "surface-container-lowest": "#000000",
                        "surface-container-high": "#1f1c36",
                        "surface-container-highest": "#25223e",
                        "on-surface": "#e7e2fe",
                        "on-surface-variant": "#c9c5d0",
                        "outline-variant": "#48455b",
                        "tertiary-container": "#8f43fb",
                        "on-tertiary-container": "#ffffff",
                        "on-primary": "#004343",
                        "error": "#ff6e84"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.5rem", 
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    
    <!-- Custom Styles -->
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(25, 23, 46, 0.7) 0%, rgba(19, 17, 38, 0.8) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .neon-glow {
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.3));
        }
        
        body {
            background: #0e0c1f;
            color: #e7e2fe;
        }
    </style>
    
    <link rel="stylesheet" href="{{ app_url('/static/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-background text-on-surface min-h-screen">
    <header class="fixed top-0 left-0 right-0 z-50 glass-card border-b border-outline-variant/20">
        <div class="mx-auto flex w-full max-w-7xl items-center justify-between gap-3 px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex min-w-0 items-center gap-3">
                <a href="{{ app_url('/queue') }}" class="w-8 h-8 overflow-hidden rounded-full bg-primary/20 hover:bg-primary/30 transition-colors" title="{{ t('queue.title') }}">
                    <img
                        src="{{ app_url('/static/karaoke-icon.png') }}"
                        alt="Karaoke"
                        class="h-full w-full object-cover"
                    >
                </a>
                <div class="min-w-0">
                    <h1 class="truncate font-headline font-bold text-lg text-on-surface">{% block header_title %}{{ t('app.karaoke') }}{% endblock %}</h1>
                </div>
            </div>
            <nav class="flex min-w-0 flex-wrap items-center justify-end gap-1 sm:gap-2">
                <div class="relative inline-flex">
                    <form id="language-form" action="{{ app_url('/language') }}" method="post" class="hidden">
                        <input type="hidden" name="next" value="{{ request.url.path }}">
                        <select
                            id="language-select"
                            name="language"
                            class="hidden"
                        >
                            {% for locale in supported_locales() %}
                            <option value="{{ locale.code }}" {% if locale.code == current_locale(request) %}selected{% endif %}>
                                {% if locale.code == 'en' %}EN{% else %}ZH{% endif %}
                            </option>
                            {% endfor %}
                        </select>
                    </form>
                    <button
                        id="language-selector-btn"
                        type="button"
                        class="flex-none text-primary active:scale-95 transition-transform p-1.5 hover:bg-primary/10 rounded-full sm:p-2"
                        aria-label="{{ t('app.language') }}"
                        title="{{ t('app.language') }}"
                    >
                        <span class="material-symbols-outlined">language</span>
                    </button>
                    <!-- Language Popover Menu -->
                    <div
                        id="language-popover"
                        class="hidden absolute top-full right-0 mt-1 z-50 min-w-32 rounded-lg bg-surface-container border border-white/10 shadow-lg"
                    >
                        <div class="py-2">
                            <button
                                type="button"
                                data-language="en"
                                class="w-full flex items-center gap-3 px-4 py-2 text-sm text-on-surface hover:bg-surface-container-high/50 transition-colors {% if current_locale(request) == 'en' %}bg-primary/10 text-primary{% endif %}"
                            >
                                <span class="material-symbols-outlined text-base">language</span>
                                <span>English</span>
                            </button>
                            <button
                                type="button"
                                data-language="zh-CN"
                                class="w-full flex items-center gap-3 px-4 py-2 text-sm text-on-surface hover:bg-surface-container-high/50 transition-colors {% if current_locale(request) == 'zh-CN' %}bg-primary/10 text-primary{% endif %}"
                            >
                                <span class="material-symbols-outlined text-base">language</span>
                                <span>中文</span>
                            </button>
                        </div>
                    </div>
                </div>
                <a href="{{ app_url('/queue') }}" class="flex-none text-primary active:scale-95 transition-transform p-1.5 hover:bg-primary/10 rounded-full sm:p-2 {% if is_active_path(request, '/queue') or request.url.path == app_url('/') %}bg-primary/10{% endif %}" aria-label="{{ t('queue.title') }}">
                    <span class="material-symbols-outlined">queue_music</span>
                </a>
                <a href="{{ app_url('/media') }}" class="flex-none text-primary active:scale-95 transition-transform p-1.5 hover:bg-primary/10 rounded-full sm:p-2 {% if is_active_path(request, '/media') %}bg-primary/10{% endif %}" aria-label="{{ t('media.library') }}">
                    <span class="material-symbols-outlined">folder_open</span>
                </a>
 
              {% if request.cookies.get("karaoke_admin_session") %}
                <a href="{{ app_url('/stage') }}" class="flex-none text-primary active:scale-95 transition-transform p-1.5 hover:bg-primary/10 rounded-full sm:p-2 {% if is_active_path(request, '/stage') %}bg-primary/10{% endif %}" aria-label="{{ t('stage.title') }}">
                    <span class="material-symbols-outlined">live_tv</span>
                </a>
               <a href="{{ app_url('/settings') }}" class="flex-none text-primary active:scale-95 transition-transform p-1.5 hover:bg-primary/10 rounded-full sm:p-2 {% if is_active_path(request, '/settings') %}bg-primary/10{% endif %}" aria-label="{{ t('nav.settings') }}">
                    <span class="material-symbols-outlined">settings</span>
                </a>
                {% endif %}
            </nav>
        </div>
    </header>
    {% block content %}{% endblock %}
    <script>
        window.KARAOKE_BASE_PATH = {{ app_url('') | tojson }};
        window.KARAOKE_LOCALE = {{ current_locale(request) | tojson }};
        window.KARAOKE_I18N_CATALOGS = {{ i18n_catalogs() | tojson }};
        window.KaraokeI18n = {
            locale: window.KARAOKE_LOCALE || "en",
            catalogs: window.KARAOKE_I18N_CATALOGS || {},
            t(key, params = {}) {
                const active = this.catalogs[this.locale] || {};
                const fallback = this.catalogs.en || {};
                let value = active[key] || fallback[key] || key;
                Object.entries(params || {}).forEach(([name, replacement]) => {
                    value = value.replaceAll(`{${name}}`, String(replacement ?? ""));
                });
                return value;
            },
        };
    </script>
    <script src="{{ app_url('/static/app-urls.js') }}"></script>
    <script src="{{ app_url('/static/language-selector.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
