[project]
name = "karaoke"
version = "0.1.0"
description = "Lightweight AI-powered karaoke application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0",
    "yt-dlp",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "opencc-python-reimplemented>=0.1.7",
    "pypinyin>=0.51.0",
    "segno>=1.4.0",
    "sqlalchemy>=2.0.25",
    "requests>=2.33.1",
    "pycryptodome>=3.22.0",
    "pylrc>=0.1.2",
    "pysubs2>=1.8.0",
    "srt>=3.5.3",
    "yt-dlp-ejs>=0.8.0",
]

[tool.setuptools]
py-modules = []

[project.optional-dependencies]
vocal-sync = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-static-i18n>=1.3.1",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py311"
exclude = ["docs", "static/docs", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
