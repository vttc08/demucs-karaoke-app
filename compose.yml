services:
  karaoke:
    image: ${KARAOKE_IMAGE:-vttc08/demucs-karaoke-app:latest}
    container_name: karaoke
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${KARAOKE_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: sqlite:////data/karaoke.db
      MEDIA_PATH: /data/media
      CACHE_PATH: /data/cache
      LOG_DIR: /data/logs
      YTDLP_PATH: yt-dlp
      YTDLP_DENO_PATH: /usr/local/bin/deno
      FFMPEG_PATH: ffmpeg
      DEMUCS_API_URL: ${DEMUCS_API_URL:-http://demucs-host:8001}
      DEMUCS_API_KEY: ${DEMUCS_API_KEY:-}
      KARAOKE_BASE_PATH: ${KARAOKE_BASE_PATH:-}
    volumes:
      - ${KARAOKE_DATA_DIR:-./data}:/data
    restart: unless-stopped
