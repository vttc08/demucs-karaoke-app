services:
  karaoke:
    image: ${KARAOKE_IMAGE:-karaoke:latest}
    container_name: karaoke
    build:
      context: .
      target: ${KARAOKE_BUILD_TARGET:-app}
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${KARAOKE_PORT:-8000}:8000"
    environment:
      DEMUCS_API_URL: ${DEMUCS_API_URL:-http://demucs-host:8001}
      DEMUCS_API_KEY: ${DEMUCS_API_KEY:-}
      KARAOKE_BASE_PATH: ${KARAOKE_BASE_PATH:-}
    volumes:
      - ${KARAOKE_DATA_DIR:-./data}:/data
    restart: unless-stopped
