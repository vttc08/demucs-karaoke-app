services:
  karaoke:
    image: vttc08/demucs-karaoke-app:latest
    container_name: karaoke
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/karaoke.db
      MEDIA_PATH: /data/media
      CACHE_PATH: /data/cache
      LOG_DIR: /data/logs
      YTDLP_PATH: yt-dlp
      YTDLP_DENO_PATH: /usr/local/bin/deno
      FFMPEG_PATH: ffmpeg
    volumes:
      - ./data:/data
    restart: unless-stopped
