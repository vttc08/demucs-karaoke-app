site_name: Demucs Karaoke App
docs_dir: docs
site_dir: site
site_url: ""
use_directory_urls: true

theme:
  name: material
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom

extra_css:
  - assets/stylesheets/karaoke.css
extra_javascript:
  - assets/javascripts/docs-root-links.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
  - Features:
      - Queue Page: features/queue-page.md
  - Tasks:
      - Create AI Karaoke: tasks/create-ai-karaoke.md
  - Troubleshooting:
      - Troubleshooting: troubleshooting/index.md
